<div class="auth-layout">
  <!-- Background decoration -->
  <div class="auth-background" aria-hidden="true">
    <div class="auth-bg-circle auth-bg-circle-1"></div>
    <div class="auth-bg-circle auth-bg-circle-2"></div>
  </div>

  <!-- Content -->
  <div class="auth-container">
    <!-- Logo -->
    <div class="auth-logo">
      <a routerLink="/" aria-label="Ir al inicio">
        <span class="auth-logo-text">CambiaAltok</span>
      </a>
    </div>

    <!-- Card -->
    <div class="auth-card">
      <router-outlet></router-outlet>
    </div>

    <!-- Footer link -->
    <div class="auth-footer">
      <a routerLink="/" class="auth-footer-link">
        <i class="pi pi-arrow-left"></i>
        Volver al inicio
      </a>
    </div>
  </div>
</div>
