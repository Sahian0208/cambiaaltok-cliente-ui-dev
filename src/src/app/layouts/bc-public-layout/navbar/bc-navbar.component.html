<nav
  class="mx-auto flex h-16 sm:h-20 w-full max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8 font-gotham text-[#00394b]"
>
  <!-- Logo Fazilito (Color/Dark version for light navbar) -->
  <button
    (click)="navigateToPage('home')"
    type="button"
    class="cursor-pointer bg-transparent border-none p-0 flex items-center"
  >
    <img src="/fazilito-logo.png" alt="Fazilito - Casa de Cambio y Remesas" class="h-8.5 sm:h-10 lg:h-11.5 w-auto object-contain drop-shadow-xs hover:scale-105 transition-transform" />
  </button>

  <!-- Desktop Nav Links -->
  <div class="hidden items-center gap-7 lg:gap-9 text-[15px] font-medium text-[#00394b]/85 md:flex">
    <button
      type="button"
      (click)="scrollToSection('how-it-works')"
      class="group relative cursor-pointer bg-transparent border-none py-1 text-[15px] font-semibold text-[#00394b] transition hover:text-[#18a796]"
    >
      Cómo funciona
      <span
        class="absolute -bottom-1.5 left-0 h-[3px] w-0 rounded-full bg-[#18a796] transition-all duration-300 group-hover:w-full"
      ></span>
    </button>
    <button
      type="button"
      (click)="scrollToSection('promociones')"
      class="group relative cursor-pointer bg-transparent border-none py-1 text-[15px] text-[#00394b]/85 transition hover:text-[#18a796]"
    >
      Promociones
      <span
        class="absolute -bottom-1.5 left-0 h-[3px] w-0 rounded-full bg-[#18a796] transition-all duration-300 group-hover:w-full"
      ></span>
    </button>
    <button
      type="button"
      (click)="scrollToSection('about-us')"
      class="group relative cursor-pointer bg-transparent border-none py-1 text-[15px] text-[#00394b]/85 transition hover:text-[#18a796]"
    >
      Quiénes somos
      <span
        class="absolute -bottom-1.5 left-0 h-[3px] w-0 rounded-full bg-[#18a796] transition-all duration-300 group-hover:w-full"
      ></span>
    </button>
    <button
      type="button"
      (click)="scrollToSection('about-us')"
      class="group relative cursor-pointer bg-transparent border-none py-1 text-[15px] text-[#00394b]/85 transition hover:text-[#18a796]"
    >
      Blog
      <span
        class="absolute -bottom-1.5 left-0 h-[3px] w-0 rounded-full bg-[#18a796] transition-all duration-300 group-hover:w-full"
      ></span>
    </button>
  </div>

  <!-- Desktop Auth Buttons -->
  <div class="hidden items-center gap-3 md:flex">
    @if (!authService.isAuthenticated()) {
      <a
        routerLink="/login"
        class="inline-flex cursor-pointer items-center justify-center rounded-xl border border-[#00394b]/30 px-5 py-2 text-sm font-semibold text-[#00394b] transition hover:bg-slate-50 hover:border-[#00394b]/60 no-underline"
      >
        Iniciar sesión
      </a>

      <!-- Register button with submenu -->
      <div class="register-menu-container relative">
        <button
          type="button"
          (click)="toggleRegisterMenu()"
          class="inline-flex cursor-pointer items-center gap-2 rounded-xl bg-[#18a796] hover:bg-[#148e80] px-5 py-2.5 text-sm font-bold text-white shadow-sm shadow-[#18a796]/20 transition-all hover:shadow-md border-none"
        >
          Regístrate
          <i class="pi pi-chevron-down text-xs"></i>
        </button>

        @if (registerMenuOpen()) {
          <div class="register-submenu absolute right-0 top-full mt-2 w-52 rounded-2xl bg-white p-1.5 shadow-xl border border-slate-100 z-50 overflow-hidden animate-fadeIn">
            <button
              type="button"
              (click)="navigateToRegister('persona')"
              class="flex w-full items-center gap-2.5 px-4 py-3 text-sm font-medium text-slate-700 hover:bg-emerald-50 hover:text-[#18a796] rounded-xl transition cursor-pointer bg-transparent border-none text-left"
            >
              <i class="pi pi-user text-[#18a796]"></i> Registrar Persona
            </button>
            <button
              type="button"
              (click)="navigateToRegister('empresa')"
              class="flex w-full items-center gap-2.5 px-4 py-3 text-sm font-medium text-slate-700 hover:bg-emerald-50 hover:text-[#18a796] rounded-xl transition cursor-pointer bg-transparent border-none text-left"
            >
              <i class="pi pi-building text-[#18a796]"></i> Registrar Empresa
            </button>
          </div>
        }
      </div>
    } @else {
      <a
        routerLink="/cliente/perfil"
        class="inline-flex cursor-pointer items-center gap-2 rounded-xl px-4 py-2 text-sm font-bold text-[#00394b] bg-slate-50 hover:bg-slate-100 transition no-underline"
      >
        <i class="pi pi-verified text-[#18a796]"></i>
        {{ userDisplayName() }}
      </a>
      <a
        (click)="logout()"
        class="inline-flex cursor-pointer items-center gap-2 rounded-xl border border-[#00394b]/25 px-4 py-2 text-sm font-medium text-[#00394b] transition hover:bg-red-50 hover:text-red-600 hover:border-red-200 no-underline"
      >
        <i class="pi pi-sign-out"></i> Salir
      </a>
    }
  </div>

  <!-- Mobile Hamburger Button -->
  <button
    type="button"
    class="inline-flex items-center justify-center rounded-xl p-2.5 text-[#00394b] hover:bg-slate-100 transition md:hidden border-none bg-transparent cursor-pointer"
    (click)="toggleMobileMenu()"
    aria-label="Abrir menú"
  >
    @if (!mobileMenuOpen()) {
      <svg
        class="h-6 w-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16"
        />
      </svg>
    } @else {
      <svg
        class="h-6 w-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M6 18L18 6M6 6l12 12"
        />
      </svg>
    }
  </button>
</nav>

<!-- Mobile Menu -->
@if (mobileMenuOpen()) {
  <div class="border-t border-slate-100 bg-white px-4 pb-6 pt-3 shadow-lg md:hidden font-gotham text-[#00394b]">
    <div class="flex flex-col gap-1">
      <button
        type="button"
        (click)="scrollToSection('how-it-works'); closeMobileMenu()"
        class="w-full rounded-xl px-4 py-2.5 text-left text-sm font-semibold text-[#00394b] hover:bg-slate-50 border-none bg-transparent cursor-pointer"
      >
        Cómo funciona
      </button>
      <button
        type="button"
        (click)="scrollToSection('promociones'); closeMobileMenu()"
        class="w-full rounded-xl px-4 py-2.5 text-left text-sm font-medium text-[#00394b] hover:bg-slate-50 border-none bg-transparent cursor-pointer"
      >
        Promociones
      </button>
      <button
        type="button"
        (click)="scrollToSection('about-us'); closeMobileMenu()"
        class="w-full rounded-xl px-4 py-2.5 text-left text-sm font-medium text-[#00394b] hover:bg-slate-50 border-none bg-transparent cursor-pointer"
      >
        Quiénes somos
      </button>      
      <button
        type="button"
        (click)="scrollToSection('about-us'); closeMobileMenu()"
        class="w-full rounded-xl px-4 py-2.5 text-left text-sm font-medium text-[#00394b] hover:bg-slate-50 border-none bg-transparent cursor-pointer"
      >
        Blog
      </button>      
    </div>
    <div class="mt-4 flex flex-col gap-2.5 border-t border-slate-100 pt-4">
      @if (!authService.isAuthenticated()) {
        <a
          routerLink="/login"
          (click)="closeMobileMenu()"
          class="flex items-center justify-center gap-2 rounded-xl border border-[#00394b]/30 px-4 py-3 text-sm font-semibold text-[#00394b] hover:bg-slate-50 no-underline"
        >
          Iniciar sesión
        </a>
        <button
          type="button"
          (click)="navigateToRegister('persona')"
          class="flex items-center justify-center gap-2 rounded-xl bg-[#18a796] hover:bg-[#148e80] px-4 py-3 text-sm font-bold text-white shadow-sm border-none cursor-pointer"
        >
          Regístrate como Persona
        </button>
        <button
          type="button"
          (click)="navigateToRegister('empresa')"
          class="flex items-center justify-center gap-2 rounded-xl bg-[#00394b] hover:bg-[#002b38] px-4 py-3 text-sm font-bold text-white shadow-sm border-none cursor-pointer"
        >
          Regístrate como Empresa
        </button>
      } @else {
        <a
          routerLink="/cliente/perfil"
          (click)="closeMobileMenu()"
          class="flex items-center justify-center gap-2 rounded-xl bg-slate-50 px-4 py-3 text-sm font-bold text-[#00394b] cursor-pointer no-underline"
        >
          <i class="pi pi-verified text-[#18a796]"></i>
          {{ userDisplayName() }}
        </a>
        <a
          (click)="logout(); closeMobileMenu()"
          class="flex items-center justify-center gap-2 rounded-xl border border-red-200 text-red-600 px-4 py-2.5 text-sm font-medium hover:bg-red-50 cursor-pointer no-underline"
        >
          <i class="pi pi-sign-out"></i> Cerrar Sesión
        </a>
      }
    </div>
  </div>
}
