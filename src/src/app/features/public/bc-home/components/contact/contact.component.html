<section
  id="contact"
  class="relative flex flex-col justify-center overflow-hidden bg-gradient-to-b from-white via-[#f0fdfa]/30 to-slate-50 py-12 sm:py-20 lg:py-24 font-gotham"
>
  <!-- Background Glows & Dotted Grid Accents -->
  <div class="pointer-events-none absolute -left-20 top-20 h-80 w-80 rounded-full bg-[#18a796]/8 blur-3xl"></div>
  <div class="pointer-events-none absolute -right-20 bottom-20 h-80 w-80 rounded-full bg-[#33bb9c]/10 blur-3xl"></div>

  <!-- Contenedor principal -->
  <div class="relative mx-auto w-full max-w-4xl px-4 sm:px-6 lg:px-8 z-10">
    
    <!-- Encabezado (Alineado a la izquierda, exacto a maqueta) -->
    <div
      shared-view-port="animate-soft-rise"
      hiddenClasses="opacity-0"
      [delay]="80"
      class="text-left mb-6 sm:mb-8"
    >
      <!-- Eyebrow Tag -->
      <span class="text-[#00394b] text-xs sm:text-sm font-extrabold tracking-widest uppercase block mb-1">
        CONTACTO
      </span>
      <div class="w-12 h-1 bg-[#18a796] rounded-full mb-2.5"></div>

      <!-- Main Title -->
      <h2 class="text-3xl sm:text-4xl lg:text-5xl font-black tracking-tight text-[#00394b] font-display leading-tight">
        Estamos cerca de ti
      </h2>

      <!-- Subtitle -->
      <p class="mt-2 text-sm sm:text-base text-slate-600 font-normal leading-relaxed">
        Visítanos o contacta a nuestro equipo.
      </p>
    </div>

    <!-- Layout Grid: 1 columna en móvil (idéntico a maqueta), 2 columnas en PC/Tablet grande -->
    <div class="flex flex-col gap-6 lg:grid lg:grid-cols-12 lg:gap-8 items-start">
      
      <!-- Card 1: Visítanos en Miraflores con Mapa y Botón Cómo llegar -->
      <div class="w-full lg:col-span-7 bg-white rounded-[26px] sm:rounded-[32px] p-5 sm:p-7 border border-slate-100 shadow-lg shadow-[#00394b]/5 flex flex-col justify-between">
        
        <!-- Header con Icono de Pin y Título -->
        <div class="flex items-center gap-3 sm:gap-3.5 mb-3.5">
          <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-2xl bg-[#e6f7f5] text-[#18a796] flex items-center justify-center shrink-0">
            <svg class="w-5 h-5 fill-current text-[#18a796]" viewBox="0 0 24 24">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5-2.5-1.12 2.5-2.5 2.5z"/>
            </svg>
          </div>
          <h3 class="text-xl sm:text-2xl font-black text-[#00394b] font-display leading-tight">
            Visítanos en Miraflores
          </h3>
        </div>

        <!-- Detalles de Dirección y Horario -->
        <div class="space-y-2 mb-3.5">
          <!-- Dirección -->
          <div class="flex items-center gap-2.5 text-sm sm:text-base font-bold text-[#00394b]">
            <svg class="w-4 h-4 text-[#18a796] shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
            </svg>
            <span>Cal. Arias Schreiber 165, Miraflores</span>
          </div>

          <!-- Horario -->
          <div class="flex items-center gap-2.5 text-xs sm:text-sm font-normal text-slate-600">
            <svg class="w-4 h-4 text-[#18a796] shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>Lunes a viernes • 9:00 a. m. – 6:00 p. m.</span>
          </div>
        </div>

        <!-- Mapa ilustrado con pines y calles -->
        <div class="relative w-full overflow-hidden rounded-2xl border border-slate-100 my-2 shadow-xs">
          <img
            src="/contact-map.png"
            alt="Ubicación Fazilito - Coronel Luis Arias Schreiber 165, Miraflores"
            class="w-full h-auto object-cover"
          />
        </div>

        <!-- Botón Cómo llegar -->
        <a
          href="https://maps.google.com/?q=Calle+Arias+Schreiber+165+Miraflores+Lima"
          target="_blank"
          rel="noopener noreferrer"
          class="mt-3.5 flex w-full items-center justify-center gap-2 rounded-2xl bg-[#18a796] hover:bg-[#139a89] py-3.5 px-6 text-base font-black text-white shadow-lg shadow-[#18a796]/20 hover:shadow-xl hover:scale-[1.01] active:scale-[0.99] transition-all no-underline cursor-pointer border-none"
        >
          <span>Cómo llegar</span>
          <svg class="w-4 h-4 fill-none stroke-current stroke-2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
          </svg>
        </a>

      </div>

      <!-- Card 2: Contáctanos -->
      <div class="w-full lg:col-span-5 flex flex-col">
        <!-- Título Contáctanos -->
        <h3 class="text-2xl font-black text-[#00394b] font-display mb-3">
          Contáctanos
        </h3>

        <!-- Contenedor blanco con los dos items -->
        <div class="bg-white rounded-[26px] sm:rounded-[32px] p-4 sm:p-5 border border-slate-100 shadow-lg shadow-[#00394b]/5 flex flex-col gap-3">
          
          <!-- Item 1: Llámanos -->
          <a
            href="tel:+51994790996"
            class="bg-[#f0fdf9] hover:bg-[#e6f7f5] rounded-2xl p-3.5 flex items-center justify-between border border-emerald-100/60 transition-all no-underline group cursor-pointer"
          >
            <div class="flex items-center">
              <!-- Icono Teléfono -->
              <div class="w-10 h-10 rounded-xl bg-white text-[#18a796] flex items-center justify-center shadow-xs shrink-0">
                <svg class="w-5 h-5 fill-current text-[#18a796]" viewBox="0 0 24 24">
                  <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.01-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z" />
                </svg>
              </div>

              <!-- Separador vertical -->
              <div class="w-px h-6 bg-slate-200/80 mx-3 shrink-0"></div>

              <!-- Textos -->
              <div class="min-w-0 text-left">
                <span class="block text-sm font-black text-[#00394b] leading-tight">
                  Llámanos
                </span>
                <span class="block text-xs font-semibold text-slate-600 mt-0.5">
                  +51 994 790 996
                </span>
              </div>
            </div>

            <!-- Flecha derecha -->
            <svg class="w-4 h-4 text-[#18a796] group-hover:translate-x-1 transition-transform shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
          </a>

          <!-- Item 2: Escríbenos -->
          <a
            href="mailto:operaciones@srcambio.pe"
            class="bg-[#f0fdf9] hover:bg-[#e6f7f5] rounded-2xl p-3.5 flex items-center justify-between border border-emerald-100/60 transition-all no-underline group cursor-pointer"
          >
            <div class="flex items-center">
              <!-- Icono Sobre Mail -->
              <div class="w-10 h-10 rounded-xl bg-white text-[#18a796] flex items-center justify-center shadow-xs shrink-0">
                <svg class="w-5 h-5 fill-none stroke-current stroke-2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
                </svg>
              </div>

              <!-- Separador vertical -->
              <div class="w-px h-6 bg-slate-200/80 mx-3 shrink-0"></div>

              <!-- Textos -->
              <div class="min-w-0 text-left">
                <span class="block text-sm font-black text-[#00394b] leading-tight">
                  Escríbenos
                </span>
                <span class="block text-xs font-semibold text-slate-600 mt-0.5 truncate">
                  operaciones@srcambio.pe
                </span>
              </div>
            </div>

            <!-- Flecha derecha -->
            <svg class="w-4 h-4 text-[#18a796] group-hover:translate-x-1 transition-transform shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
            </svg>
          </a>

        </div>
      </div>

    </div>

  </div>
</section>
