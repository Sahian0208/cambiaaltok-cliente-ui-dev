<section
  id="about-us"
  class="relative w-full overflow-hidden bg-white py-12 sm:py-16 lg:py-20 font-gotham border-b border-slate-100"
>
  <!-- Background glowing accents -->
  <div
    class="pointer-events-none absolute -left-20 top-1/2 -translate-y-1/2 h-80 w-80 rounded-full bg-[#18a796]/5 blur-3xl"
  ></div>
  <div
    class="pointer-events-none absolute -right-20 top-1/2 -translate-y-1/2 h-96 w-96 rounded-full bg-[#00394b]/5 blur-3xl"
  ></div>

  <div class="relative mx-auto w-full max-w-7xl px-4 sm:px-6 lg:px-8 z-10">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-center">
      
      <!-- Left Column: Copy -->
      <div class="lg:col-span-6 xl:col-span-6 space-y-4 sm:space-y-5 text-left">
        <!-- Section Title -->
        <div>
          <h2
            class="text-3xl sm:text-4xl lg:text-[44px] font-black tracking-tight text-[#00394b] leading-tight"
          >
            ¿Qué es <span class="text-[#33bb9c]">fazilito?</span>
          </h2>
          <div class="w-16 h-1.5 bg-[#18a796] rounded-full mt-2.5"></div>
        </div>

        <!-- Description (Resumido y directo) -->
        <p class="text-sm sm:text-base lg:text-[17px] text-[#00394b]/85 leading-relaxed font-normal">
          <strong class="text-[#18a796] font-extrabold">fazilito</strong> es tu plataforma de cambio y remesas para comprar y vender Bolivianos y Soles entre Bolivia y Perú de forma <strong class="text-[#00394b] font-bold">rápida, segura y transparente</strong>, con el mejor tipo de cambio del mercado.
        </p>
      </div>

      <!-- Right Column: Visual Infographic Illustration (Aparece antes de los recuadros) -->
      <div class="lg:col-span-6 xl:col-span-6 flex justify-center lg:justify-end relative">
        <div class="relative w-full max-w-[480px] lg:max-w-[540px] flex items-center justify-center">
          <img
            src="/about-fazilito.png"
            alt="¿Qué es fazilito? - Cambio y Remesas Perú Bolivia"
            class="w-full h-auto object-contain hover:scale-[1.02] transition-transform duration-500"
          />
        </div>
      </div>

    </div>

    <!-- 4 Feature Badges (Ubicados después de la imagen) -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4 pt-8 sm:pt-10">
      <!-- 1: Operaciones seguras -->
      <div class="flex items-center gap-2.5 bg-slate-50/90 hover:bg-emerald-50/50 p-3 sm:p-3.5 rounded-2xl border border-slate-200/70 transition-all hover:shadow-sm">
        <div class="w-9 h-9 rounded-xl bg-emerald-100/70 text-[#18a796] flex items-center justify-center shrink-0">
          <i class="pi pi-shield text-base"></i>
        </div>
        <span class="text-xs sm:text-sm font-bold text-[#00394b] leading-tight">
          Operaciones<br />seguras
        </span>
      </div>

      <!-- 2: Procesos rápidos -->
      <div class="flex items-center gap-2.5 bg-slate-50/90 hover:bg-emerald-50/50 p-3 sm:p-3.5 rounded-2xl border border-slate-200/70 transition-all hover:shadow-sm">
        <div class="w-9 h-9 rounded-xl bg-emerald-100/70 text-[#18a796] flex items-center justify-center shrink-0">
          <i class="pi pi-bolt text-base"></i>
        </div>
        <span class="text-xs sm:text-sm font-bold text-[#00394b] leading-tight">
          Procesos<br />rápidos
        </span>
      </div>

      <!-- 3: Atención personalizada -->
      <div class="flex items-center gap-2.5 bg-slate-50/90 hover:bg-emerald-50/50 p-3 sm:p-3.5 rounded-2xl border border-slate-200/70 transition-all hover:shadow-sm">
        <div class="w-9 h-9 rounded-xl bg-emerald-100/70 text-[#18a796] flex items-center justify-center shrink-0">
          <i class="pi pi-users text-base"></i>
        </div>
        <span class="text-xs sm:text-sm font-bold text-[#00394b] leading-tight">
          Atención<br />personalizada
        </span>
      </div>

      <!-- 4: Tipo de cambio competitivo -->
      <div class="flex items-center gap-2.5 bg-slate-50/90 hover:bg-emerald-50/50 p-3 sm:p-3.5 rounded-2xl border border-slate-200/70 transition-all hover:shadow-sm">
        <div class="w-9 h-9 rounded-xl bg-emerald-100/70 text-[#18a796] flex items-center justify-center shrink-0">
          <i class="pi pi-chart-bar text-base"></i>
        </div>
        <span class="text-xs sm:text-sm font-bold text-[#00394b] leading-tight">
          Tipo de cambio<br />competitivo
        </span>
      </div>
    </div>
  </div>
</section>
