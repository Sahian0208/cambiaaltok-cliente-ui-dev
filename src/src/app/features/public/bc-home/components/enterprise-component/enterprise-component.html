<div class="bg-white/95 rounded-[28px] sm:rounded-[32px] p-6 sm:p-7 shadow-[0_20px_50px_rgba(0,57,75,0.10)] border border-slate-100/90 relative backdrop-blur-sm font-gotham">
  
  <h2 class="text-xl sm:text-2xl font-black text-[#00394b] leading-tight mb-5">
    ¿Tienes dudas? <span class="text-[#18a796] font-extrabold">Déjanos tus datos para contactarte</span>
  </h2>

  <form class="space-y-4" (submit)="$event.preventDefault()">
    <!-- Row 1: Nombre & Apellido -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
      <div class="space-y-1.5">
        <label class="block text-xs font-bold text-[#00394b]/90">
          Nombre<span class="text-red-500 font-bold">*</span>
        </label>
        <input
          type="text"
          class="w-full bg-slate-50/70 hover:bg-white focus:bg-white border border-slate-200 focus:border-[#18a796] focus:ring-2 focus:ring-[#18a796]/15 rounded-xl px-3.5 py-2.5 outline-none transition text-sm text-[#00394b] font-medium placeholder:text-slate-400"
          placeholder="Nombre"
          required
        />
      </div>
      <div class="space-y-1.5">
        <label class="block text-xs font-bold text-[#00394b]/90">
          Apellido
        </label>
        <input
          type="text"
          class="w-full bg-slate-50/70 hover:bg-white focus:bg-white border border-slate-200 focus:border-[#18a796] focus:ring-2 focus:ring-[#18a796]/15 rounded-xl px-3.5 py-2.5 outline-none transition text-sm text-[#00394b] font-medium placeholder:text-slate-400"
          placeholder="Apellido"
        />
      </div>
    </div>

    <!-- Row 2: Correo electrónico & Número de teléfono -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
      <div class="space-y-1.5">
        <label class="block text-xs font-bold text-[#00394b]/90">
          Correo electrónico<span class="text-red-500 font-bold">*</span>
        </label>
        <input
          type="email"
          class="w-full bg-slate-50/70 hover:bg-white focus:bg-white border border-slate-200 focus:border-[#18a796] focus:ring-2 focus:ring-[#18a796]/15 rounded-xl px-3.5 py-2.5 outline-none transition text-sm text-[#00394b] font-medium placeholder:text-slate-400"
          placeholder="ejemplo@correo.com"
          required
        />
      </div>
      <div class="space-y-1.5">
        <label class="block text-xs font-bold text-[#00394b]/90">
          Número de teléfono<span class="text-red-500 font-bold">*</span>
        </label>
        <div class="phone-input-wrapper flex bg-slate-50/70 hover:bg-white focus-within:bg-white border border-slate-200 rounded-xl overflow-hidden focus-within:border-[#18a796] focus-within:ring-2 focus-within:ring-[#18a796]/15 transition">
          <button
            type="button"
            (click)="toggleEnterprisePhoneCountry()"
            class="country-toggle-btn phone-prefix-btn flex items-center justify-center gap-1 bg-slate-100/80 hover:bg-slate-200/70 border-r border-slate-200 px-2.5 py-2.5 text-[#00394b] text-xs font-bold select-none cursor-pointer transition border-none"
          >
            <span>{{ enterprisePhoneCountry() }}</span>
            <span class="text-slate-500 font-medium">{{ enterprisePhoneDialCode() }}</span>
          </button>
          <input
            type="tel"
            class="phone-number-input w-full min-w-0 bg-transparent px-3 py-2.5 outline-none border-none text-sm text-[#00394b] font-medium placeholder:text-slate-400"
            placeholder="987 654 321"
            required
          />
        </div>
      </div>
    </div>

    <!-- Row 3: ¿Por qué medio deseas ser contactado? -->
    <div class="space-y-1.5">
      <label class="block text-xs font-bold text-[#00394b]/90">
        ¿Por qué medio deseas ser contactado?
      </label>
      <div class="relative">
        <select
          class="w-full bg-slate-50/70 hover:bg-white focus:bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 appearance-none outline-none focus:border-[#18a796] focus:ring-2 focus:ring-[#18a796]/15 transition text-sm text-[#00394b] font-medium pr-10 cursor-pointer"
        >
          <option value="correo">Correo electrónico</option>
          <option value="telefono">Llamada Telefónica</option>
          <option value="whatsapp">WhatsApp</option>
        </select>
        <div class="absolute inset-y-0 right-0 flex items-center pr-3.5 pointer-events-none text-slate-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Row 4: Deja aquí tu duda o comentario -->
    <div class="space-y-1.5">
      <label class="block text-xs font-bold text-[#00394b]/90">
        Deja aquí tu duda o comentario
      </label>
      <textarea
        rows="3"
        class="w-full bg-slate-50/70 hover:bg-white focus:bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 outline-none focus:border-[#18a796] focus:ring-2 focus:ring-[#18a796]/15 transition text-sm text-[#00394b] font-medium resize-none placeholder:text-slate-400"
        placeholder="Escribe tu mensaje..."
      ></textarea>
    </div>

    <!-- Submit Button -->
    <div class="pt-2 flex justify-center">
      <button
        type="submit"
        class="bg-[#33bb9c] hover:bg-[#18a796] text-white font-bold py-3 px-12 rounded-xl text-sm uppercase tracking-wider transition-all duration-300 shadow-md hover:shadow-lg shadow-[#33bb9c]/30 hover:shadow-[#18a796]/40 active:scale-95 border-none cursor-pointer font-gotham"
      >
        ENVIAR
      </button>
    </div>
  </form>
</div>
