<main class="flex min-h-full w-full flex-col">
  <section
    id="home"
    class="relative bg-gradient-to-b from-[#04142E] via-altok-night to-altok-deep text-white overflow-hidden pb-20 sm:pb-28 lg:pb-32 pt-2 sm:pt-10 lg:pt-12 px-4 sm:px-6 lg:px-8"
  >
    <div
      [style.opacity]="tipoCambio() === 'BOB_TO_PEN' ? '0.75' : '0'"
      class="absolute inset-0 bg-[url('/salar-de-uyuni.jpg')] bg-cover bg-center transition-opacity duration-700 pointer-events-none z-0"
    ></div>

    <div
      [style.opacity]="tipoCambio() === 'PEN_TO_BOB' ? '0.75' : '0'"
      class="absolute inset-0 bg-[url('/machu-picchu.jpg')] bg-cover bg-center transition-opacity duration-700 pointer-events-none z-0"
    ></div>

    <div
      class="absolute inset-0 bg-gradient-to-r from-[#04142E] via-[#04142E] via-50% to-transparent pointer-events-none z-0"
    ></div>

    <div
      class="absolute top-0 right-0 w-[500px] h-[500px] bg-blue-500/10 rounded-full blur-3xl -mr-60 -mt-60 pointer-events-none z-0"
    ></div>
    <div
      class="absolute bottom-0 left-0 w-[600px] h-[400px] bg-blue-500/5 rounded-full blur-3xl -ml-80 -mb-40 pointer-events-none z-0"
    ></div>

    <div class="relative hero-container">
      <!-- Left: Text content -->
      <div class="hero-text">
        <!-- Personas / Empresas cards -->
        <div
          shared-view-port="animate-soft-rise"
          hiddenClasses="opacity-0"
          [delay]="300"
          class="flex flex-wrap gap-2 md:gap-3 mt-1 md:mt-2"
        >
          <div
            id="newPerson"
            (click)="showCalculatorPanel()"
            class="flex items-center gap-2 md:gap-3 bg-white/10 backdrop-blur-sm border border-white/15 rounded-xl px-3 md:px-4 py-2 md:py-3 hover:bg-white/15 hover:-translate-y-1 hover:shadow-lg hover:border-white/30 transition-all duration-300 cursor-pointer"
            [ngClass]="rightPanel() === 'calculator' ? 'bg-white/20 border-white/40' : ''"
          >
            <i class="pi pi-user text-base md:text-xl text-slate-300"></i>
            <div>
              <p class="text-xs md:text-sm font-semibold text-white">
                Personas
              </p>
              <p class="hidden sm:block text-xs text-slate-400">
                Cuentas personales
              </p>
            </div>
          </div>
          <div
            id="newCompany"
            (click)="showEnterprisePanel()"
            class="flex items-center gap-2 md:gap-3 bg-white/10 backdrop-blur-sm border border-white/15 rounded-xl px-3 md:px-4 py-2 md:py-3 hover:bg-white/15 hover:-translate-y-1 hover:shadow-lg hover:border-white/30 transition-all duration-300 cursor-pointer"
            [ngClass]="rightPanel() === 'enterprise' ? 'bg-white/20 border-white/40' : ''"
          >
            <i class="pi pi-building text-base md:text-xl text-slate-300"></i>
            <div>
              <p class="text-xs md:text-sm font-semibold text-white">
                Empresas
              </p>
              <p class="hidden sm:block text-xs text-slate-400">
                Registra tu Empresa
              </p>
            </div>
          </div>
        </div>

        <!-- desde -->

        <div max-w-[600px] space-y-4 lg:space-y-6>
          <h1            
            class="text-4xl sm:text-3xl lg:text-5xl xl:text-6xl font-extrabold tracking-tight leading-tight text-white font-display"
          >
            <span class="block overflow-visible pb-1">
              <span
                shared-view-port="animate-hero-word"
                hiddenClasses="opacity-0"
                [delay]="100"
                class="mr-2 inline-block text-transparent bg-clip-text bg-gradient-to-r from-[#0B63FF] to-[#12D6EB]"
                >Transfiere fazilito
              </span>

              <span
                shared-view-port="animate-hero-word"
                hiddenClasses="opacity-0"
                [delay]="210"
                class="mr-2 inline-block"
              >
                tus
              </span>

              <span
                shared-view-port="animate-hero-word"
                hiddenClasses="opacity-0"
                [delay]="320"
                class="inline-block text-[#21F0D2]"
              >
                Bolivianos
              </span>
            </span>

            <span
              shared-view-port="animate-hero-word"
              hiddenClasses="opacity-0"
              [delay]="460"
              class="mr-2 inline-block"
            >
              y
            </span>

            <span
              shared-view-port="animate-hero-word"
              hiddenClasses="opacity-0"
              [delay]="590"
              class="mr-2 inline-block text-[#12D6EB]"
            >
              Soles
            </span>

            <span
              shared-view-port="animate-hero-word"
              hiddenClasses="opacity-0"
              [delay]="720"
              class="inline-block text-[#12D6EB]"
            >
              online
            </span>
          </h1>

          <p
            shared-view-port="animate-soft-rise"
            hiddenClasses="opacity-0"
            [delay]="840"
            class="text-xs md:text-sm text-slate-300 mb-3 md:mb-5 leading-relaxed animate-[fadeInUp_0.8s_ease-out_0.2s_both]"
          >
            Altok conecta tus operaciones entre soles peruanos y bolivianos con
            una experiencia moderna, transparente y confiable.
          </p>
        </div>

        <!-- hasta aqui-->

        <div
          shared-view-port="animate-soft-rise"
          hiddenClasses="opacity-0"
          [delay]="500"
          class="mb-2.5 md:mb-5 animate-[fadeInUp_0.8s_ease-out_0.3s_both]"
        >
          <app-better-rate-upload />
        </div>

        <!-- CTA Buttons -->
        <div
          shared-view-port="animate-soft-rise"
          hiddenClasses="opacity-0"
          [delay]="520"
          class="flex flex-wrap gap-2 md:gap-3 animate-[fadeInUp_0.8s_ease-out_0.4s_both]"
        >
          <a
            href="https://wa.me/59172237251"
            target="_blank"
            
            class="px-3 py-2 rounded-lg bg-emerald-600 text-white text-xs sm:text-sm font-semibold hover:bg-emerald-700 disabled:opacity-60 disabled:cursor-not-allowed transition-colors cursor-pointer"
          >
            <i class="pi pi-whatsapp"></i>
            Solicitar via Whatsapp
          </a>
          <a
            href="mailto:contacto&#64;cambiaaltok.com"
            class="inline-flex items-center justify-center gap-1.5 md:gap-2 bg-white/5 hover:bg-white/10 text-white font-semibold py-2 md:py-2.5 px-3.5 md:px-5 rounded-xl border border-white/20 hover:border-white/40 transition-all duration-200 text-xs md:text-sm"
          >
            <i class="pi pi-envelope"></i>
            Escribir Correo
          </a>
        </div>
      </div>

      <div
        shared-view-port="animate-soft-rise"
        hiddenClasses="opacity-0"
        [delay]="500"
        class="hero-calculator pt-4"
      >
        <div class="lg:col-span-5 relative order-1 lg:order-2">
          <div
            *ngIf="rightPanel() === 'calculator'"
            class="hidden lg:block absolute -right-[230px] xl:-right-[270px] -bottom-[70px] w-72 h-72 z-30 pointer-events-none select-none"
          >
            <div
              [ngClass]="
                  tipoCambio() === 'BOB_TO_PEN'
                    ? 'translate-x-0 opacity-100'
                    : 'translate-x-[120%] opacity-0'
                "
              class="absolute inset-0 transition-all duration-700 ease-out"
            >
              <div class="w-full h-full animate-float-sway">
                <img
                  src="/img/billetes/bolivia_hand_cash.webp"
                  alt="Billetes Bolivianos"
                  class="cash-image-fade w-full h-full object-contain drop-shadow-[0_15px_30px_rgba(0,0,0,0.2)]"
                />
              </div>
            </div>

            <div
              [ngClass]="
                  tipoCambio() === 'PEN_TO_BOB'
                    ? 'translate-x-0 opacity-100'
                    : 'translate-x-[120%] opacity-0'
                "
              class="absolute inset-0 transition-all duration-700 ease-out"
            >
              <div class="w-full h-full animate-float-sway">
                <img
                  src="/img/billetes/peru_hand_cash.webp"
                  alt="Billetes Soles"
                  class="cash-image-fade w-full h-full object-contain drop-shadow-[0_15px_30px_rgba(0,0,0,0.2)]"
                />
              </div>
            </div>
          </div>

          <div
            class="home-calc-card relative w-full lg:max-w-[390px] mx-auto lg:mr-0 lg:ml-auto lg:-mt-4"
            [class.hidden]="rightPanel() !== 'calculator'"
          >
            <app-calculator (swapped)="tipoCambio.set($event)"></app-calculator>
          </div>

          <div
            class="home-calc-card relative w-full lg:max-w-[620px] xl:max-w-[680px] mx-auto lg:mr-0 lg:ml-auto lg:-mt-4"
            [class.hidden]="rightPanel() !== 'enterprise'"
          >
            <app-enterprise-component></app-enterprise-component>
          </div>
        </div>
      </div>
    </div>
  </section>
  <banks-promotion></banks-promotion>
  <about-us></about-us>
  <how-it-works></how-it-works>
  <contact></contact>
</main>
